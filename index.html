<!doctype html>
<html lang="es">
  <head>
    <script>
      window.deferredPWAEvent = null;
      console.log("PWA: Script de alta prioridad inicializado (v2.2)");

      window.addEventListener("beforeinstallprompt", (e) => {
        console.log("PWA: ¡EVENTO CAPTURADO! Chrome ha dado permiso.");
        e.preventDefault();
        window.deferredPWAEvent = e;
        window.dispatchEvent(new CustomEvent("pwa-ready"));
      });
    </script>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Inter:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#059669" />
    <link rel="apple-touch-icon" href="/leaf.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((reg) => console.log("SW registered!", reg))
            .catch((err) => console.log("SW registration failed: ", err));
        });
      }
    </script>
  </body>
</html>
